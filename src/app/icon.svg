    <circle cx="130" cy="322" r="20" fill="white" opacity="0.8" />
    <circle cx="256" cy="392" r="20" fill="white" opacity="0.8" />
    <circle cx="382" cy="322" r="20" fill="white" opacity="0.8" />
    <circle cx="382" cy="190" r="20" fill="white" opacity="0.8" />
    
    <!-- Node Lines -->
    <path d="M256 256L256 120 M256 256L130 190 M256 256L130 322 M256 256L256 392 M256 256L382 322 M256 256L382 190" 
